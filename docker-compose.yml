services:
  time-server:
    build: .
    container_name: time-server
    command: java -cp /app/bin Clock.TimeServer
    ports:
      - "1239:1239"
      - "2239:2239"
    environment:
      - RMI_SERVER_HOST=time-server
    networks:
      - ev-rmi-network

  charging-station:
    build: .
    container_name: charging-station
    command: java -cp /app/bin ChargingStationServer
    ports:
      - "1234:1234"
      - "2234:2234"
    environment:
      - RMI_SERVER_HOST=charging-station
      - TIME_SERVER_HOST=time-server
      - LD_PRELOAD=/usr/lib/x86_64-linux-gnu/faketime/libfaketime.so.1
      - FAKETIME=@2026-08-26 15:30:10
    depends_on:
      - time-server
    networks:
      - ev-rmi-network

  pricing:
    build: .
    container_name: pricing
    command: java -cp /app/bin PricingServer
    ports:
      - "1238:1238"
      - "2238:2238"
    environment:
      - RMI_SERVER_HOST=pricing
      - TIME_SERVER_HOST=time-server
      - LD_PRELOAD=/usr/lib/x86_64-linux-gnu/faketime/libfaketime.so.1
      - FAKETIME=@2026-08-26 15:30:03
    depends_on:
      - time-server
    networks:
      - ev-rmi-network

  reservation-primary:
    build: .
    container_name: reservation-primary
    command: java -cp /app/bin ReservationServer primary 1235
    ports:
      - "1235:1235"
      - "2235:2235"
    environment:
      - RMI_SERVER_HOST=reservation-primary
      - RESERVATION_ROLE=PRIMARY
      - RMI_REGISTRY_PORT=1235
      - STATION_HOST=charging-station
      - MANAGER_HOST=reservation-manager
      - MANAGER_PORT=1240
      - TIME_SERVER_HOST=time-server
      - LD_PRELOAD=/usr/lib/x86_64-linux-gnu/faketime/libfaketime.so.1
      - FAKETIME=@2026-08-26 15:30:05
    depends_on:
      - time-server
      - charging-station
    networks:
      - ev-rmi-network

  reservation-secondary:
    build: .
    container_name: reservation-secondary
    command: java -cp /app/bin ReservationServer secondary 1245
    ports:
      - "1245:1245"
      - "2245:2245"
    environment:
      - RMI_SERVER_HOST=reservation-secondary
      - RESERVATION_ROLE=SECONDARY
      - RMI_REGISTRY_PORT=1245
      - STATION_HOST=charging-station
      - MANAGER_HOST=reservation-manager
      - MANAGER_PORT=1240
      - TIME_SERVER_HOST=time-server
      - LD_PRELOAD=/usr/lib/x86_64-linux-gnu/faketime/libfaketime.so.1
      - FAKETIME=@2026-08-26 15:30:05
    depends_on:
      - time-server
      - charging-station
    networks:
      - ev-rmi-network

  reservation-manager:
    build: .
    container_name: reservation-manager
    command: java -cp /app/bin ReservationServerManager
    ports:
      - "1240:1240"
      - "2240:2240"
    environment:
      - RMI_SERVER_HOST=reservation-manager
      - PRIMARY_HOST=reservation-primary
      - SECONDARY_HOST=reservation-secondary
      - MANAGER_PORT=1240
      - TIME_SERVER_HOST=time-server
      - LD_PRELOAD=/usr/lib/x86_64-linux-gnu/faketime/libfaketime.so.1
      - FAKETIME=@2026-08-26 15:30:05
    depends_on:
      - time-server
      - reservation-primary
      - reservation-secondary
    networks:
      - ev-rmi-network

  charging-session:
    build: .
    container_name: charging-session
    command: java -cp /app/bin ChargingSessionServer
    ports:
      - "1236:1236"
      - "2236:2236"
    environment:
      - RMI_SERVER_HOST=charging-session
      - STATION_HOST=charging-station
      - MANAGER_HOST=reservation-manager
      - MANAGER_PORT=1240
      - RESERVATION_HOST=reservation-manager
      - TIME_SERVER_HOST=time-server
      - LD_PRELOAD=/usr/lib/x86_64-linux-gnu/faketime/libfaketime.so.1
      - FAKETIME=@2026-08-26 15:29:55
    depends_on:
      - time-server
      - charging-station
      - reservation-manager
    networks:
      - ev-rmi-network

  payment:
    build: .
    container_name: payment
    command: java -cp /app/bin PaymentServer
    ports:
      - "1237:1237"
      - "2237:2237"
    environment:
      - RMI_SERVER_HOST=payment
      - STATION_HOST=charging-station
      - SESSION_HOST=charging-session
      - PRICING_HOST=pricing
      - TIME_SERVER_HOST=time-server
      - LD_PRELOAD=/usr/lib/x86_64-linux-gnu/faketime/libfaketime.so.1
      - FAKETIME=@2026-08-26 15:29:50
    depends_on:
      - time-server
      - charging-station
      - charging-session
      - pricing
    networks:
      - ev-rmi-network

networks:
  ev-rmi-network:
    driver: bridge
