x-mysql-healthcheck: &mysql-healthcheck
  test: ["CMD", "mysqladmin", "ping", "-h", "localhost", "-uroot", "-pevroot"]
  interval: 10s
  timeout: 5s
  retries: 10
  start_period: 60s

x-app-build: &app-build
  build: .

services:

  # ================================================================
  # INFRASTRUCTURE: Time Server (Cristian reference clock, no DB)
  # ================================================================

  time-server:
    <<: *app-build
    container_name: time-server
    command: java -cp /app/bin Clock.TimeServer
    ports:
      - "1239:1239"
      - "2239:2239"
    environment:
      - RMI_SERVER_HOST=time-server
    networks:
      - ev-rmi-network

  # ================================================================
  # DATABASES: one MySQL instance per server instance (15 total)
  # ================================================================

  mysql-station-1:
    image: mysql:8.0
    container_name: mysql-station-1
    environment: {MYSQL_ROOT_PASSWORD: evroot, MYSQL_DATABASE: ev_station_db}
    volumes: ["station1-db-data:/var/lib/mysql", "./db/init/01_ev_station_db.sql:/docker-entrypoint-initdb.d/init.sql:ro"]
    healthcheck: *mysql-healthcheck
    networks: [ev-rmi-network]

  mysql-station-2:
    image: mysql:8.0
    container_name: mysql-station-2
    environment: {MYSQL_ROOT_PASSWORD: evroot, MYSQL_DATABASE: ev_station_db_2}
    volumes: ["station2-db-data:/var/lib/mysql", "./db/init/07_ev_station_db_2.sql:/docker-entrypoint-initdb.d/init.sql:ro"]
    healthcheck: *mysql-healthcheck
    networks: [ev-rmi-network]

  mysql-station-3:
    image: mysql:8.0
    container_name: mysql-station-3
    environment: {MYSQL_ROOT_PASSWORD: evroot, MYSQL_DATABASE: ev_station_db_3}
    volumes: ["station3-db-data:/var/lib/mysql", "./db/init/08_ev_station_db_3.sql:/docker-entrypoint-initdb.d/init.sql:ro"]
    healthcheck: *mysql-healthcheck
    networks: [ev-rmi-network]

  mysql-reservation-1:
    image: mysql:8.0
    container_name: mysql-reservation-1
    environment: {MYSQL_ROOT_PASSWORD: evroot, MYSQL_DATABASE: ev_reservation_secondary_db}
    volumes: ["reservation1-db-data:/var/lib/mysql", "./db/init/03_ev_reservation_secondary_db.sql:/docker-entrypoint-initdb.d/init.sql:ro"]
    ports: ["3308:3306"]
    healthcheck: *mysql-healthcheck
    networks: [ev-rmi-network]

  mysql-reservation-2:
    image: mysql:8.0
    container_name: mysql-reservation-2
    environment: {MYSQL_ROOT_PASSWORD: evroot, MYSQL_DATABASE: ev_reservation_tertiary_db}
    volumes: ["reservation2-db-data:/var/lib/mysql", "./db/init/09_ev_reservation_tertiary_db.sql:/docker-entrypoint-initdb.d/init.sql:ro"]
    ports: ["3309:3306"]
    healthcheck: *mysql-healthcheck
    networks: [ev-rmi-network]

  mysql-reservation-3:
    image: mysql:8.0
    container_name: mysql-reservation-3
    environment: {MYSQL_ROOT_PASSWORD: evroot, MYSQL_DATABASE: ev_reservation_primary_db}
    volumes: ["reservation3-db-data:/var/lib/mysql", "./db/init/02_ev_reservation_primary_db.sql:/docker-entrypoint-initdb.d/init.sql:ro"]
    ports: ["3307:3306"]
    healthcheck: *mysql-healthcheck
    networks: [ev-rmi-network]

  mysql-session-1:
    image: mysql:8.0
    container_name: mysql-session-1
    environment: {MYSQL_ROOT_PASSWORD: evroot, MYSQL_DATABASE: ev_session_db}
    volumes: ["session1-db-data:/var/lib/mysql", "./db/init/04_ev_session_db.sql:/docker-entrypoint-initdb.d/init.sql:ro"]
    healthcheck: *mysql-healthcheck
    networks: [ev-rmi-network]

  mysql-session-2:
    image: mysql:8.0
    container_name: mysql-session-2
    environment: {MYSQL_ROOT_PASSWORD: evroot, MYSQL_DATABASE: ev_session_db_2}
    volumes: ["session2-db-data:/var/lib/mysql", "./db/init/10_ev_session_db_2.sql:/docker-entrypoint-initdb.d/init.sql:ro"]
    healthcheck: *mysql-healthcheck
    networks: [ev-rmi-network]

  mysql-session-3:
    image: mysql:8.0
    container_name: mysql-session-3
    environment: {MYSQL_ROOT_PASSWORD: evroot, MYSQL_DATABASE: ev_session_db_3}
    volumes: ["session3-db-data:/var/lib/mysql", "./db/init/11_ev_session_db_3.sql:/docker-entrypoint-initdb.d/init.sql:ro"]
    healthcheck: *mysql-healthcheck
    networks: [ev-rmi-network]

  mysql-pricing-1:
    image: mysql:8.0
    container_name: mysql-pricing-1
    environment: {MYSQL_ROOT_PASSWORD: evroot, MYSQL_DATABASE: ev_pricing_db}
    volumes: ["pricing1-db-data:/var/lib/mysql", "./db/init/05_ev_pricing_db.sql:/docker-entrypoint-initdb.d/init.sql:ro"]
    healthcheck: *mysql-healthcheck
    networks: [ev-rmi-network]

  mysql-pricing-2:
    image: mysql:8.0
    container_name: mysql-pricing-2
    environment: {MYSQL_ROOT_PASSWORD: evroot, MYSQL_DATABASE: ev_pricing_db_2}
    volumes: ["pricing2-db-data:/var/lib/mysql", "./db/init/12_ev_pricing_db_2.sql:/docker-entrypoint-initdb.d/init.sql:ro"]
    healthcheck: *mysql-healthcheck
    networks: [ev-rmi-network]

  mysql-pricing-3:
    image: mysql:8.0
    container_name: mysql-pricing-3
    environment: {MYSQL_ROOT_PASSWORD: evroot, MYSQL_DATABASE: ev_pricing_db_3}
    volumes: ["pricing3-db-data:/var/lib/mysql", "./db/init/13_ev_pricing_db_3.sql:/docker-entrypoint-initdb.d/init.sql:ro"]
    healthcheck: *mysql-healthcheck
    networks: [ev-rmi-network]

  mysql-payment-1:
    image: mysql:8.0
    container_name: mysql-payment-1
    environment: {MYSQL_ROOT_PASSWORD: evroot, MYSQL_DATABASE: ev_payment_db}
    volumes: ["payment1-db-data:/var/lib/mysql", "./db/init/06_ev_payment_db.sql:/docker-entrypoint-initdb.d/init.sql:ro"]
    healthcheck: *mysql-healthcheck
    networks: [ev-rmi-network]

  mysql-payment-2:
    image: mysql:8.0
    container_name: mysql-payment-2
    environment: {MYSQL_ROOT_PASSWORD: evroot, MYSQL_DATABASE: ev_payment_db_2}
    volumes: ["payment2-db-data:/var/lib/mysql", "./db/init/14_ev_payment_db_2.sql:/docker-entrypoint-initdb.d/init.sql:ro"]
    healthcheck: *mysql-healthcheck
    networks: [ev-rmi-network]

  mysql-payment-3:
    image: mysql:8.0
    container_name: mysql-payment-3
    environment: {MYSQL_ROOT_PASSWORD: evroot, MYSQL_DATABASE: ev_payment_db_3}
    volumes: ["payment3-db-data:/var/lib/mysql", "./db/init/15_ev_payment_db_3.sql:/docker-entrypoint-initdb.d/init.sql:ro"]
    healthcheck: *mysql-healthcheck
    networks: [ev-rmi-network]

  # ================================================================
  # CHARGING STATION CLUSTER (CS1/CS2/CS3) -- Bully election among themselves
  # ================================================================

  charging-station-1:
    <<: *app-build
    container_name: charging-station-1
    command: java -cp /app/bin:/mysql-lib/mysql-connector-j-8.0.33.jar ChargingStationServer
    ports: ["1234:1234", "2234:2234"]
    environment:
      - RMI_SERVER_HOST=charging-station-1
      - SERVER_ID=1
      - RMI_REGISTRY_PORT=1234
      - RMI_EXPORT_PORT=2234
      - PEERS=2:charging-station-2:1244,3:charging-station-3:1254
      - MANAGER_HOST=manager
      - MANAGER_PORT=1240
      - TIME_SERVER_HOST=time-server
      - LD_PRELOAD=/usr/lib/x86_64-linux-gnu/faketime/libfaketime.so.1
      - FAKETIME=@2026-08-26 15:30:10
      - DB_HOST=mysql-station-1
      - DB_PORT=3306
      - DB_NAME=ev_station_db
      - DB_USER=root
      - DB_PASSWORD=evroot
    depends_on:
      time-server: {condition: service_started}
      mysql-station-1: {condition: service_healthy}
    networks: [ev-rmi-network]

  charging-station-2:
    <<: *app-build
    container_name: charging-station-2
    command: java -cp /app/bin:/mysql-lib/mysql-connector-j-8.0.33.jar ChargingStationServer
    ports: ["1244:1244", "2244:2244"]
    environment:
      - RMI_SERVER_HOST=charging-station-2
      - SERVER_ID=2
      - RMI_REGISTRY_PORT=1244
      - RMI_EXPORT_PORT=2244
      - PEERS=1:charging-station-1:1234,3:charging-station-3:1254
      - MANAGER_HOST=manager
      - MANAGER_PORT=1240
      - TIME_SERVER_HOST=time-server
      - LD_PRELOAD=/usr/lib/x86_64-linux-gnu/faketime/libfaketime.so.1
      - FAKETIME=@2026-08-26 15:30:13
      - DB_HOST=mysql-station-2
      - DB_PORT=3306
      - DB_NAME=ev_station_db_2
      - DB_USER=root
      - DB_PASSWORD=evroot
    depends_on:
      time-server: {condition: service_started}
      mysql-station-2: {condition: service_healthy}
    networks: [ev-rmi-network]

  charging-station-3:
    <<: *app-build
    container_name: charging-station-3
    command: java -cp /app/bin:/mysql-lib/mysql-connector-j-8.0.33.jar ChargingStationServer
    ports: ["1254:1254", "2254:2254"]
    environment:
      - RMI_SERVER_HOST=charging-station-3
      - SERVER_ID=3
      - RMI_REGISTRY_PORT=1254
      - RMI_EXPORT_PORT=2254
      - PEERS=1:charging-station-1:1234,2:charging-station-2:1244
      - MANAGER_HOST=manager
      - MANAGER_PORT=1240
      - TIME_SERVER_HOST=time-server
      - LD_PRELOAD=/usr/lib/x86_64-linux-gnu/faketime/libfaketime.so.1
      - FAKETIME=@2026-08-26 15:30:16
      - DB_HOST=mysql-station-3
      - DB_PORT=3306
      - DB_NAME=ev_station_db_3
      - DB_USER=root
      - DB_PASSWORD=evroot
    depends_on:
      time-server: {condition: service_started}
      mysql-station-3: {condition: service_healthy}
    networks: [ev-rmi-network]

  # ================================================================
  # MANAGER -- single entry point for EVClient across all 5 clusters
  # ================================================================

  manager:
    <<: *app-build
    container_name: manager
    command: java -cp /app/bin:/mysql-lib/mysql-connector-j-8.0.33.jar ReservationServerManager
    ports: ["1240:1240", "2240:2240"]
    environment:
      - RMI_SERVER_HOST=manager
      - MANAGER_PORT=1240
      # Classic 2-node fields (kept for getReplicationStatus/manual full-sync tooling)
      - PRIMARY_HOST=reservation-3
      - SECONDARY_HOST=reservation-1
      # Generalized N-instance discovery for all 5 clusters
      - STATION_INSTANCES=1:charging-station-1:1234,2:charging-station-2:1244,3:charging-station-3:1254
      - SESSION_INSTANCES=1:charging-session-1:1236,2:charging-session-2:1246,3:charging-session-3:1256
      - PRICING_INSTANCES=1:pricing-1:1238,2:pricing-2:1248,3:pricing-3:1258
      - PAYMENT_INSTANCES=1:payment-1:1237,2:payment-2:1247,3:payment-3:1257
      - RESERVATION_INSTANCES=3:reservation-3:1235,1:reservation-1:1245,2:reservation-2:1255
      - TIME_SERVER_HOST=time-server
      - LD_PRELOAD=/usr/lib/x86_64-linux-gnu/faketime/libfaketime.so.1
      - FAKETIME=@2026-08-26 15:30:05
    depends_on:
      time-server: {condition: service_started}
      charging-station-1: {condition: service_started}
      charging-station-2: {condition: service_started}
      charging-station-3: {condition: service_started}
    networks: [ev-rmi-network]

  # ================================================================
  # RESERVATION CLUSTER (R1/R2/R3) -- 3-node Bully election + replication.
  # R3 starts as the initial Primary (highest server ID); R1/R2 start
  # Secondary. All cross-service calls (ChargingStation) route via Manager.
  # ================================================================

  reservation-1:
    <<: *app-build
    container_name: reservation-1
    command: java -cp /app/bin:/mysql-lib/mysql-connector-j-8.0.33.jar ReservationServer secondary 1245
    ports: ["1245:1245", "2245:2245"]
    environment:
      - RMI_SERVER_HOST=reservation-1
      - RESERVATION_ROLE=SECONDARY
      - RMI_REGISTRY_PORT=1245
      - SERVER_ID=1
      - PEERS=3:reservation-3:1235,2:reservation-2:1255
      - MANAGER_HOST=manager
      - MANAGER_PORT=1240
      - TIME_SERVER_HOST=time-server
      - LD_PRELOAD=/usr/lib/x86_64-linux-gnu/faketime/libfaketime.so.1
      - FAKETIME=@2026-08-26 15:30:05
      - DB_HOST=mysql-reservation-1
      - DB_PORT=3306
      - DB_NAME=ev_reservation_secondary_db
      - DB_USER=root
      - DB_PASSWORD=evroot
    depends_on:
      time-server: {condition: service_started}
      manager: {condition: service_started}
      mysql-reservation-1: {condition: service_healthy}
    networks: [ev-rmi-network]

  reservation-2:
    <<: *app-build
    container_name: reservation-2
    command: java -cp /app/bin:/mysql-lib/mysql-connector-j-8.0.33.jar ReservationServer secondary 1255
    ports: ["1255:1255", "2255:2255"]
    environment:
      - RMI_SERVER_HOST=reservation-2
      - RESERVATION_ROLE=SECONDARY
      - RMI_REGISTRY_PORT=1255
      - SERVER_ID=2
      - PEERS=3:reservation-3:1235,1:reservation-1:1245
      - MANAGER_HOST=manager
      - MANAGER_PORT=1240
      - TIME_SERVER_HOST=time-server
      - LD_PRELOAD=/usr/lib/x86_64-linux-gnu/faketime/libfaketime.so.1
      - FAKETIME=@2026-08-26 15:30:07
      - DB_HOST=mysql-reservation-2
      - DB_PORT=3306
      - DB_NAME=ev_reservation_tertiary_db
      - DB_USER=root
      - DB_PASSWORD=evroot
    depends_on:
      time-server: {condition: service_started}
      manager: {condition: service_started}
      mysql-reservation-2: {condition: service_healthy}
    networks: [ev-rmi-network]

  reservation-3:
    <<: *app-build
    container_name: reservation-3
    command: java -cp /app/bin:/mysql-lib/mysql-connector-j-8.0.33.jar ReservationServer primary 1235
    ports: ["1235:1235", "2235:2235"]
    environment:
      - RMI_SERVER_HOST=reservation-3
      - RESERVATION_ROLE=PRIMARY
      - RMI_REGISTRY_PORT=1235
      - SERVER_ID=3
      - PEERS=1:reservation-1:1245,2:reservation-2:1255
      - MANAGER_HOST=manager
      - MANAGER_PORT=1240
      - TIME_SERVER_HOST=time-server
      - LD_PRELOAD=/usr/lib/x86_64-linux-gnu/faketime/libfaketime.so.1
      - FAKETIME=@2026-08-26 15:30:09
      - DB_HOST=mysql-reservation-3
      - DB_PORT=3306
      - DB_NAME=ev_reservation_primary_db
      - DB_USER=root
      - DB_PASSWORD=evroot
    depends_on:
      time-server: {condition: service_started}
      manager: {condition: service_started}
      charging-station-1: {condition: service_started}
      charging-station-2: {condition: service_started}
      charging-station-3: {condition: service_started}
      mysql-reservation-3: {condition: service_healthy}
    networks: [ev-rmi-network]

  # ================================================================
  # CHARGING SESSION CLUSTER (S1/S2/S3)
  # ================================================================

  charging-session-1:
    <<: *app-build
    container_name: charging-session-1
    command: java -cp /app/bin:/mysql-lib/mysql-connector-j-8.0.33.jar ChargingSessionServer
    ports: ["1236:1236", "2236:2236"]
    environment:
      - RMI_SERVER_HOST=charging-session-1
      - SERVER_ID=1
      - RMI_REGISTRY_PORT=1236
      - RMI_EXPORT_PORT=2236
      - PEERS=2:charging-session-2:1246,3:charging-session-3:1256
      - MANAGER_HOST=manager
      - MANAGER_PORT=1240
      - TIME_SERVER_HOST=time-server
      - LD_PRELOAD=/usr/lib/x86_64-linux-gnu/faketime/libfaketime.so.1
      - FAKETIME=@2026-08-26 15:29:55
      - DB_HOST=mysql-session-1
      - DB_PORT=3306
      - DB_NAME=ev_session_db
      - DB_USER=root
      - DB_PASSWORD=evroot
    depends_on:
      time-server: {condition: service_started}
      manager: {condition: service_started}
      reservation-3: {condition: service_started}
      mysql-session-1: {condition: service_healthy}
    networks: [ev-rmi-network]

  charging-session-2:
    <<: *app-build
    container_name: charging-session-2
    command: java -cp /app/bin:/mysql-lib/mysql-connector-j-8.0.33.jar ChargingSessionServer
    ports: ["1246:1246", "2246:2246"]
    environment:
      - RMI_SERVER_HOST=charging-session-2
      - SERVER_ID=2
      - RMI_REGISTRY_PORT=1246
      - RMI_EXPORT_PORT=2246
      - PEERS=1:charging-session-1:1236,3:charging-session-3:1256
      - MANAGER_HOST=manager
      - MANAGER_PORT=1240
      - TIME_SERVER_HOST=time-server
      - LD_PRELOAD=/usr/lib/x86_64-linux-gnu/faketime/libfaketime.so.1
      - FAKETIME=@2026-08-26 15:29:58
      - DB_HOST=mysql-session-2
      - DB_PORT=3306
      - DB_NAME=ev_session_db_2
      - DB_USER=root
      - DB_PASSWORD=evroot
    depends_on:
      time-server: {condition: service_started}
      manager: {condition: service_started}
      reservation-3: {condition: service_started}
      mysql-session-2: {condition: service_healthy}
    networks: [ev-rmi-network]

  charging-session-3:
    <<: *app-build
    container_name: charging-session-3
    command: java -cp /app/bin:/mysql-lib/mysql-connector-j-8.0.33.jar ChargingSessionServer
    ports: ["1256:1256", "2256:2256"]
    environment:
      - RMI_SERVER_HOST=charging-session-3
      - SERVER_ID=3
      - RMI_REGISTRY_PORT=1256
      - RMI_EXPORT_PORT=2256
      - PEERS=1:charging-session-1:1236,2:charging-session-2:1246
      - MANAGER_HOST=manager
      - MANAGER_PORT=1240
      - TIME_SERVER_HOST=time-server
      - LD_PRELOAD=/usr/lib/x86_64-linux-gnu/faketime/libfaketime.so.1
      - FAKETIME=@2026-08-26 15:30:01
      - DB_HOST=mysql-session-3
      - DB_PORT=3306
      - DB_NAME=ev_session_db_3
      - DB_USER=root
      - DB_PASSWORD=evroot
    depends_on:
      time-server: {condition: service_started}
      manager: {condition: service_started}
      reservation-3: {condition: service_started}
      mysql-session-3: {condition: service_healthy}
    networks: [ev-rmi-network]

  # ================================================================
  # PRICING CLUSTER (P1/P2/P3) -- read replicas, no write path
  # ================================================================

  pricing-1:
    <<: *app-build
    container_name: pricing-1
    command: java -cp /app/bin:/mysql-lib/mysql-connector-j-8.0.33.jar PricingServer
    ports: ["1238:1238", "2238:2238"]
    environment:
      - RMI_SERVER_HOST=pricing-1
      - SERVER_ID=1
      - RMI_REGISTRY_PORT=1238
      - RMI_EXPORT_PORT=2238
      - PEERS=2:pricing-2:1248,3:pricing-3:1258
      - TIME_SERVER_HOST=time-server
      - LD_PRELOAD=/usr/lib/x86_64-linux-gnu/faketime/libfaketime.so.1
      - FAKETIME=@2026-08-26 15:30:03
      - DB_HOST=mysql-pricing-1
      - DB_PORT=3306
      - DB_NAME=ev_pricing_db
      - DB_USER=root
      - DB_PASSWORD=evroot
    depends_on:
      time-server: {condition: service_started}
      mysql-pricing-1: {condition: service_healthy}
    networks: [ev-rmi-network]

  pricing-2:
    <<: *app-build
    container_name: pricing-2
    command: java -cp /app/bin:/mysql-lib/mysql-connector-j-8.0.33.jar PricingServer
    ports: ["1248:1248", "2248:2248"]
    environment:
      - RMI_SERVER_HOST=pricing-2
      - SERVER_ID=2
      - RMI_REGISTRY_PORT=1248
      - RMI_EXPORT_PORT=2248
      - PEERS=1:pricing-1:1238,3:pricing-3:1258
      - TIME_SERVER_HOST=time-server
      - LD_PRELOAD=/usr/lib/x86_64-linux-gnu/faketime/libfaketime.so.1
      - FAKETIME=@2026-08-26 15:30:04
      - DB_HOST=mysql-pricing-2
      - DB_PORT=3306
      - DB_NAME=ev_pricing_db_2
      - DB_USER=root
      - DB_PASSWORD=evroot
    depends_on:
      time-server: {condition: service_started}
      mysql-pricing-2: {condition: service_healthy}
    networks: [ev-rmi-network]

  pricing-3:
    <<: *app-build
    container_name: pricing-3
    command: java -cp /app/bin:/mysql-lib/mysql-connector-j-8.0.33.jar PricingServer
    ports: ["1258:1258", "2258:2258"]
    environment:
      - RMI_SERVER_HOST=pricing-3
      - SERVER_ID=3
      - RMI_REGISTRY_PORT=1258
      - RMI_EXPORT_PORT=2258
      - PEERS=1:pricing-1:1238,2:pricing-2:1248
      - TIME_SERVER_HOST=time-server
      - LD_PRELOAD=/usr/lib/x86_64-linux-gnu/faketime/libfaketime.so.1
      - FAKETIME=@2026-08-26 15:30:06
      - DB_HOST=mysql-pricing-3
      - DB_PORT=3306
      - DB_NAME=ev_pricing_db_3
      - DB_USER=root
      - DB_PASSWORD=evroot
    depends_on:
      time-server: {condition: service_started}
      mysql-pricing-3: {condition: service_healthy}
    networks: [ev-rmi-network]

  # ================================================================
  # PAYMENT CLUSTER (Pay1/Pay2/Pay3)
  # ================================================================

  payment-1:
    <<: *app-build
    container_name: payment-1
    command: java -cp /app/bin:/mysql-lib/mysql-connector-j-8.0.33.jar PaymentServer
    ports: ["1237:1237", "2237:2237"]
    environment:
      - RMI_SERVER_HOST=payment-1
      - SERVER_ID=1
      - RMI_REGISTRY_PORT=1237
      - RMI_EXPORT_PORT=2237
      - PEERS=2:payment-2:1247,3:payment-3:1257
      - MANAGER_HOST=manager
      - MANAGER_PORT=1240
      - TIME_SERVER_HOST=time-server
      - LD_PRELOAD=/usr/lib/x86_64-linux-gnu/faketime/libfaketime.so.1
      - FAKETIME=@2026-08-26 15:29:50
      - DB_HOST=mysql-payment-1
      - DB_PORT=3306
      - DB_NAME=ev_payment_db
      - DB_USER=root
      - DB_PASSWORD=evroot
    depends_on:
      time-server: {condition: service_started}
      manager: {condition: service_started}
      charging-session-1: {condition: service_started}
      pricing-1: {condition: service_started}
